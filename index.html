<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYCII - Image To Ascii</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #52525b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #71717a; }
        pre {
            font-family: 'Courier New', Courier, monospace;
            line-height: 0.6em; 
            white-space: pre;
            overflow-x: auto;
            overflow-y: hidden;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 font-sans min-h-screen flex flex-col items-center p-4 sm:p-8">

    <header class="w-full max-w-4xl mb-8 flex flex-col items-center text-center">
        <h1 class="text-4xl md:text-7xl font-black tracking-tighter bg-gradient-to-r from-teal-400 via-emerald-400 to-cyan-400 bg-clip-text text-transparent mb-2">
            AYCII
        </h1>
        <p class="text-zinc-500 text-sm md:text-base font-medium">
            Stable export. No more crashes.
        </p>
    </header>

    <main class="w-full max-w-6xl bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl shadow-emerald-900/10">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
            <div class="flex flex-col gap-4">
                <label class="block text-sm font-bold text-zinc-400 uppercase tracking-wider">1. Drop a File</label>
                
                <!-- Drop Zone -->
                <div class="relative group h-48">
                    <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp, image/gif" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                    <div class="absolute inset-0 border-2 border-dashed border-zinc-700 rounded-xl flex flex-col items-center justify-center transition-all group-hover:border-emerald-500 group-hover:bg-zinc-800/50 pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-500 mb-2 group-hover:text-emerald-400"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                        <p class="text-zinc-400 font-medium text-center">Click or Drag & Drop</p>
                        <p class="text-zinc-600 text-xs mt-1">JPG, PNG, GIF</p>
                    </div>
                </div>

                <!-- Filename Input -->
                <div class="flex flex-col gap-1">
                    <label for="filenameInput" class="text-xs text-zinc-500 font-bold uppercase tracking-wider">File Name</label>
                    <input type="text" id="filenameInput" placeholder="aycii-unnamed_export" class="w-full bg-zinc-800 border border-zinc-700 text-zinc-200 text-sm rounded-lg p-2.5 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-colors" />
                </div>
                
                <div id="statusContainer" class="hidden flex flex-col gap-2 mt-2">
                     <div class="flex items-center justify-center gap-2">
                        <span class="inline-block w-4 h-4 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></span>
                        <span id="statusText" class="text-emerald-400 text-sm font-mono">Processing...</span>
                    </div>
                    <div id="progressBarContainer" class="hidden w-full bg-zinc-800 rounded-full h-2 mt-1 overflow-hidden">
                        <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-100"></div>
                    </div>
                </div>
                <div id="errorMsg" class="hidden p-3 bg-red-900/20 border border-red-800 rounded-lg text-red-400 text-xs font-mono text-center"></div>
                <canvas id="canvas" class="hidden"></canvas>
            </div>

            <div class="flex flex-col gap-6 justify-center">
                <label class="block text-sm font-bold text-zinc-400 uppercase tracking-wider">2. Tweak the Vibe</label>
                
                <div>
                    <div class="flex justify-between mb-2">
                        <span class="text-zinc-300 text-sm">Resolution</span>
                        <span id="widthVal" class="text-emerald-400 text-sm font-mono">100 chars</span>
                    </div>
                    <input type="range" id="widthSlider" min="20" max="250" value="100" class="w-full h-2 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-emerald-500 hover:accent-emerald-400">
                </div>

                <div>
                    <div class="flex justify-between mb-2">
                        <span class="text-zinc-300 text-sm">Contrast</span>
                        <span id="contrastVal" class="text-emerald-400 text-sm font-mono">1.0</span>
                    </div>
                    <input type="range" id="contrastSlider" min="1" max="50" value="10" class="w-full h-2 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-emerald-500 hover:accent-emerald-400">
                </div>

                <div class="flex gap-3 items-center flex-wrap">
                    <button id="invertBtn" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg text-xs md:text-sm font-medium transition-colors border border-zinc-700 flex items-center gap-2">
                         <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                         Invert
                    </button>
                    <button id="colorBtn" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg text-xs md:text-sm font-medium transition-colors border border-zinc-700 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 14.14 14.14"/></svg>
                        Color: Off
                   </button>
                    <button id="stopBtn" class="hidden px-3 py-2 bg-red-900/50 hover:bg-red-900 text-red-200 border border-red-800 rounded-lg text-xs md:text-sm font-medium transition-colors">Stop</button>
                </div>

                <div class="pt-4 border-t border-zinc-800">
                    <label class="block text-sm font-bold text-zinc-400 uppercase tracking-wider mb-3">3. Export</label>
                    <div class="flex flex-wrap gap-2">
                        <button id="copyBtn" class="flex-1 px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg text-xs font-bold transition-all border border-zinc-700 active:scale-95 text-center">Copy</button>
                        <button id="savePngBtn" class="flex-1 px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg text-xs font-bold transition-all border border-zinc-700 active:scale-95 text-center">PNG</button>
                        <button id="saveJpgBtn" class="flex-1 px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg text-xs font-bold transition-all border border-zinc-700 active:scale-95 text-center">JPG</button>
                        <button id="saveGifBtn" class="hidden flex-1 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold transition-all shadow-lg shadow-emerald-900/20 active:scale-95 text-center">Save GIF</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="relative w-full bg-black rounded-xl border border-zinc-800 overflow-hidden min-h-[300px] flex items-center justify-center">
            <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-zinc-700 pointer-events-none">
                <p class="text-6xl font-bold opacity-20">AYCII</p>
                <p class="text-sm mt-2">Waiting for input...</p>
            </div>
            <pre id="asciiOutput" class="text-[8px] md:text-[10px] text-white overflow-auto w-full h-full p-4 text-center select-text z-10 hidden"></pre>
        </div>
        <div class="mt-4 text-center"><p id="stats" class="text-xs text-zinc-600 font-mono"></p></div>
    </main>
    <footer class="mt-12 mb-4 text-zinc-600 text-xs"><p>Built fast. Runs local. Stay cute.</p></footer>

    <script>
        const imageInput = document.getElementById('imageInput');
        const filenameInput = document.getElementById('filenameInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const asciiOutput = document.getElementById('asciiOutput');
        const placeholder = document.getElementById('placeholder');
        const widthSlider = document.getElementById('widthSlider');
        const contrastSlider = document.getElementById('contrastSlider');
        const invertBtn = document.getElementById('invertBtn');
        const colorBtn = document.getElementById('colorBtn');
        const stopBtn = document.getElementById('stopBtn');
        const copyBtn = document.getElementById('copyBtn');
        const savePngBtn = document.getElementById('savePngBtn');
        const saveJpgBtn = document.getElementById('saveJpgBtn');
        const saveGifBtn = document.getElementById('saveGifBtn');
        const widthVal = document.getElementById('widthVal');
        const contrastVal = document.getElementById('contrastVal');
        const stats = document.getElementById('stats');
        const statusContainer = document.getElementById('statusContainer');
        const statusText = document.getElementById('statusText');
        const progressBarContainer = document.getElementById('progressBarContainer');
        const progressBar = document.getElementById('progressBar');
        const errorMsg = document.getElementById('errorMsg');

        let currentMode = 'none'; 
        let staticImage = null;
        let gifData = null; 
        let isPlaying = false;
        let animationFrameId = null;
        let isInverted = false;
        let isColor = false;
        let gifCanvasCtx = null;
        let workerBlobUrl = null; 
        
        const density = " .:-=+*#%@"; 

        (async function preloadGifWorker() {
            try {
                const response = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
                const workerCode = await response.text();
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                workerBlobUrl = URL.createObjectURL(blob);
            } catch (e) {
                console.warn("Worker preload failed", e);
            }
        })();

        function getGifReader() {
            if (typeof Omggif !== 'undefined' && Omggif.GifReader) return Omggif.GifReader;
            if (typeof GifReader !== 'undefined') return GifReader;
            if (window.Omggif && window.Omggif.GifReader) return window.Omggif.GifReader;
            return null;
        }

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Auto-fill filename input with uploaded file name (without extension) if empty
            if (!filenameInput.value) {
                const name = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                filenameInput.value = name;
            }

            stopAnimation();
            resetUI(false); 
            placeholder.classList.add('hidden'); 
            asciiOutput.classList.add('hidden'); 
            showStatus(true, "Processing...");
            saveGifBtn.classList.add('hidden');
            
            if (file.type === 'image/gif') {
                statusText.innerText = "Reading GIF...";
                const reader = new FileReader();
                reader.onload = (event) => {
                    const buffer = event.target.result;
                    setTimeout(() => {
                        try {
                            const ReaderClass = getGifReader();
                            if (!ReaderClass) throw new Error("GIF library failed.");
                            const gifReader = new ReaderClass(new Uint8Array(buffer));
                            if (gifReader.numFrames() > 0) {
                                setupGif(gifReader);
                                saveGifBtn.classList.remove('hidden');
                            } else {
                                throw new Error("No frames found.");
                            }
                        } catch (err) {
                            showError("Failed to parse GIF.");
                        }
                    }, 100);
                };
                reader.readAsArrayBuffer(file);
            } else {
                statusText.innerText = "Loading Image...";
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        currentMode = 'static';
                        staticImage = img;
                        gifData = null;
                        showStatus(false);
                        processStatic();
                    };
                    img.onerror = () => showError("Could not load image.");
                    img.src = event.target.result; 
                };
                reader.readAsDataURL(file);
            }
        });

        function resetUI(clearInput = true) {
            showStatus(false);
            errorMsg.classList.add('hidden');
            if(clearInput) {
                placeholder.classList.remove('hidden');
                asciiOutput.classList.add('hidden');
                imageInput.value = "";
                filenameInput.value = "";
                saveGifBtn.classList.add('hidden');
            }
        }

        function showStatus(show, text = "") {
            if (show) {
                statusContainer.classList.remove('hidden');
                statusText.innerText = text;
            } else {
                statusContainer.classList.add('hidden');
                progressBarContainer.classList.add('hidden');
            }
        }

        function showError(msg) {
            showStatus(false);
            errorMsg.innerText = msg;
            errorMsg.classList.remove('hidden');
            placeholder.classList.remove('hidden');
        }

        function updateBtnStyle(btn, isActive) {
            if (isActive) {
                btn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-500');
                btn.classList.remove('bg-zinc-800', 'text-zinc-300', 'border-zinc-700');
            } else {
                btn.classList.add('bg-zinc-800', 'text-zinc-300', 'border-zinc-700');
                btn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-500');
            }
        }

        widthSlider.addEventListener('input', (e) => {
            widthVal.innerText = `${e.target.value} chars`;
            if (currentMode === 'static') processStatic();
        });

        contrastSlider.addEventListener('input', (e) => {
            contrastVal.innerText = (e.target.value / 10).toFixed(1);
            if (currentMode === 'static') processStatic();
        });

        invertBtn.addEventListener('click', () => {
            isInverted = !isInverted;
            updateBtnStyle(invertBtn, isInverted);
            if (currentMode === 'static') processStatic();
        });

        colorBtn.addEventListener('click', () => {
            isColor = !isColor;
            const icon = isColor 
                ? `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.74 5.88-5.74 5.88-5.74-5.88z"/><path d="M11 10.69v10.62"/><path d="M5.63 21.31h12.74"/></svg>`
                : `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 14.14 14.14"/></svg>`;
            colorBtn.innerHTML = `${icon} Color: ${isColor ? 'On' : 'Off'}`;
            updateBtnStyle(colorBtn, isColor);
            if (currentMode === 'static') processStatic();
        });

        stopBtn.addEventListener('click', () => {
            if(currentMode === 'gif') {
                isPlaying = !isPlaying;
                stopBtn.innerText = isPlaying ? "Pause" : "Play";
                stopBtn.classList.toggle('bg-red-900/50', isPlaying);
                stopBtn.classList.toggle('bg-emerald-900/50', !isPlaying);
                if (isPlaying) animateGifLoop();
            }
        });

        function setupGif(reader) {
            currentMode = 'gif';
            const gCanvas = document.createElement('canvas');
            gCanvas.width = reader.width;
            gCanvas.height = reader.height;
            gifCanvasCtx = gCanvas.getContext('2d', { willReadFrequently: true });
            gifData = {
                reader: reader,
                width: reader.width,
                height: reader.height,
                numFrames: reader.numFrames(),
                currentFrame: 0,
                framePixels: new Uint8ClampedArray(reader.width * reader.height * 4),
                canvas: gCanvas
            };
            showStatus(false);
            asciiOutput.classList.remove('hidden');
            stopBtn.classList.remove('hidden');
            stopBtn.innerText = "Pause";
            isPlaying = true;
            animateGifLoop();
        }

        function animateGifLoop() {
            if (!isPlaying || currentMode !== 'gif' || !gifData) return;
            const { reader, currentFrame, width, height } = gifData;
            const frameImageData = gifCanvasCtx.createImageData(width, height);
            try {
                reader.decodeAndBlitFrameRGBA(currentFrame, frameImageData.data);
            } catch (e) {
                stopAnimation();
                return;
            }
            const tempC = document.createElement('canvas');
            tempC.width = width;
            tempC.height = height;
            const tempCtx = tempC.getContext('2d');
            tempCtx.putImageData(frameImageData, 0, 0);
            if (currentFrame === 0) gifCanvasCtx.clearRect(0, 0, width, height);
            gifCanvasCtx.drawImage(tempC, 0, 0);
            renderAsciiFromCanvas(gifCanvasCtx.canvas);
            const info = reader.frameInfo(currentFrame);
            let delay = info.delay * 10; 
            if (delay < 20) delay = 100; 
            gifData.currentFrame = (currentFrame + 1) % gifData.numFrames;
            setTimeout(() => { if (isPlaying) requestAnimationFrame(animateGifLoop); }, delay);
        }

        function stopAnimation() {
            isPlaying = false;
            stopBtn.classList.add('hidden');
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        }

        function processStatic() {
            if (!staticImage) return;
            asciiOutput.classList.remove('hidden');
            renderAsciiFromCanvas(staticImage);
        }

        function renderAsciiFromCanvas(sourceElement) {
            const targetWidth = parseInt(widthSlider.value);
            const contrastFactor = (parseInt(contrastSlider.value) / 10);
            let srcW = sourceElement.width || sourceElement.videoWidth; 
            let srcH = sourceElement.height || sourceElement.videoHeight;
            if (sourceElement instanceof HTMLImageElement) {
                srcW = sourceElement.naturalWidth;
                srcH = sourceElement.naturalHeight;
            }
            const targetHeight = Math.floor(targetWidth * (srcH / srcW));
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            ctx.clearRect(0, 0, targetWidth, targetHeight);
            ctx.drawImage(sourceElement, 0, 0, targetWidth, targetHeight);
            const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight);
            const pixels = imageData.data;
            
            let asciiArray = [];
            let exportData = { width: targetWidth, height: targetHeight, rows: [] };

            for (let i = 0; i < targetHeight; i++) {
                let row = [];
                for (let j = 0; j < targetWidth; j++) {
                    const offset = (i * targetWidth + j) * 4;
                    let r = pixels[offset];
                    let g = pixels[offset + 1];
                    let b = pixels[offset + 2];
                    const alpha = pixels[offset + 3];

                    let char = " ";
                    let color = `rgb(${r},${g},${b})`;

                    if (alpha >= 128) {
                        let brightness = (r + g + b) / 3;
                        brightness = contrastFactor * (brightness - 128) + 128;
                        brightness = Math.max(0, Math.min(255, brightness));
                        if (isInverted) {
                            brightness = 255 - brightness;
                            if(isColor) {
                                r = 255 - r; g = 255 - g; b = 255 - b;
                                color = `rgb(${r},${g},${b})`;
                            }
                        }
                        const charIndex = Math.floor((brightness / 255) * (density.length - 1));
                        char = density.charAt(charIndex);
                    }
                    let htmlChar = char === " " ? " " : char;
                    if (isColor && char !== " ") {
                        asciiArray.push(`<span style="color: ${color}">${htmlChar}</span>`);
                    } else {
                        asciiArray.push(htmlChar);
                    }
                    row.push({ char: char, color: color });
                }
                asciiArray.push("\n");
                exportData.rows.push(row);
            }
            asciiOutput.innerHTML = asciiArray.join("");
            const typeLabel = currentMode === 'gif' ? 'GIF' : 'Static';
            const dims = `${targetWidth}x${targetHeight}`;
            stats.innerText = `${typeLabel}: ${dims} | Color: ${isColor ? 'ON' : 'OFF'}`;
            return exportData;
        }

        function generateExportCanvas(exportData) {
            const fontSize = 10;
            const lineHeight = fontSize * 0.6; 
            const charWidth = fontSize * 0.6; 
            const cWidth = Math.ceil(exportData.width * charWidth);
            const cHeight = Math.ceil(exportData.height * lineHeight); 

            const expCanvas = document.createElement('canvas');
            expCanvas.width = cWidth;
            expCanvas.height = cHeight;
            const expCtx = expCanvas.getContext('2d');
            expCtx.fillStyle = '#000000';
            expCtx.fillRect(0, 0, cWidth, cHeight);
            expCtx.font = `${fontSize}px "Courier New", monospace`;
            expCtx.textBaseline = 'top';

            for (let y = 0; y < exportData.height; y++) {
                for (let x = 0; x < exportData.width; x++) {
                    const item = exportData.rows[y][x];
                    if(item.char === " ") continue;
                    expCtx.fillStyle = isColor ? item.color : '#ffffff';
                    expCtx.fillText(item.char, x * charWidth, y * lineHeight);
                }
            }
            return expCanvas;
        }

        function getFilename(ext) {
            const val = filenameInput.value.trim();
            const base = val || "aycii-unnamed_export";
            return base + ext;
        }

        function downloadBlob(blob, filename) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }

        savePngBtn.addEventListener('click', () => {
            if(!staticImage && !gifData) return;
            const source = currentMode === 'gif' ? gifCanvasCtx.canvas : staticImage;
            const data = renderAsciiFromCanvas(source);
            const canvas = generateExportCanvas(data);
            canvas.toBlob((blob) => downloadBlob(blob, getFilename('.png')), 'image/png');
        });

        saveJpgBtn.addEventListener('click', () => {
            if(!staticImage && !gifData) return;
            const source = currentMode === 'gif' ? gifCanvasCtx.canvas : staticImage;
            const data = renderAsciiFromCanvas(source);
            const canvas = generateExportCanvas(data);
            canvas.toBlob((blob) => downloadBlob(blob, getFilename('.jpg')), 'image/jpeg', 0.9);
        });

        copyBtn.addEventListener('click', () => {
            if (!asciiOutput.innerText) return;
            const text = asciiOutput.innerText;
            navigator.clipboard.writeText(text).then(() => {
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "Copied!";
                copyBtn.classList.add('bg-zinc-100', 'text-zinc-900');
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.classList.remove('bg-zinc-100', 'text-zinc-900');
                }, 2000);
            });
        });

        saveGifBtn.addEventListener('click', async () => {
            if (currentMode !== 'gif' || !gifData) return;
            stopAnimation();
            if (!workerBlobUrl) { alert("GIF worker failed to load. Cannot save GIF."); return; }

            const totalPixels = gifData.numFrames * (gifData.width * 0.6) * (gifData.height * 0.6); 
            if (parseInt(widthSlider.value) > 150) {
                 const proceed = confirm("Warning: High resolution GIFs might crash the browser during export. Do you want to try anyway? (Recommendation: Lower resolution to < 150)");
                 if(!proceed) return;
            }

            showStatus(true, "Rendering GIF... (Do not close tab)");
            progressBarContainer.classList.remove('hidden');
            progressBar.style.width = '0%';

            try {
                const gif = new GIF({
                    workers: 2,
                    quality: 10,
                    workerScript: workerBlobUrl,
                    background: '#000000'
                });

                const { reader, numFrames } = gifData;

                for (let i = 0; i < numFrames; i++) {
                    const percent = Math.round((i / numFrames) * 50);
                    progressBar.style.width = `${percent}%`;
                    statusText.innerText = `Rendering Frame ${i+1}/${numFrames}`;

                    const frameImageData = gifCanvasCtx.createImageData(gifData.width, gifData.height);
                    reader.decodeAndBlitFrameRGBA(i, frameImageData.data);
                    
                    const tempC = document.createElement('canvas');
                    tempC.width = gifData.width;
                    tempC.height = gifData.height;
                    const tempCtx = tempC.getContext('2d');
                    tempCtx.putImageData(frameImageData, 0, 0);

                    if (i === 0) gifCanvasCtx.clearRect(0, 0, gifData.width, gifData.height);
                    gifCanvasCtx.drawImage(tempC, 0, 0);

                    const asciiData = renderAsciiFromCanvas(gifCanvasCtx.canvas);
                    const exportCanvas = generateExportCanvas(asciiData);

                    const info = reader.frameInfo(i);
                    let delay = info.delay * 10;
                    if(delay < 20) delay = 100;

                    gif.addFrame(exportCanvas, { delay: delay });
                    await new Promise(r => setTimeout(r, 10)); 
                }

                statusText.innerText = "Encoding... (Hold tight)";
                gif.on('progress', (p) => {
                    const percent = 50 + Math.round(p * 50);
                    progressBar.style.width = `${percent}%`;
                });

                gif.on('finished', (blob) => {
                    downloadBlob(blob, getFilename('.gif'));
                    showStatus(false);
                    isPlaying = true;
                    animateGifLoop();
                });
                gif.render();

            } catch (err) {
                console.error(err);
                showError("Memory Error: Try lowering resolution.");
            }
        });
    </script>
</body>
</html>
